<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>서브마린 K방 · 결제요청</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101722;color:#f7fafc;font:16px/1.5 system-ui,"Noto Sans KR",sans-serif}header{position:sticky;top:0;background:#172538;padding:16px;display:flex;justify-content:space-between;align-items:center;z-index:1}h1{font-size:19px;margin:0}main{max-width:760px;margin:auto;padding:16px}.hint{color:#b7c6d8;font-size:14px}.card{background:#223146;border:1px solid #425570;border-radius:12px;padding:18px;margin:12px 0}.card strong{font-size:21px}.meta{color:#c4d2e1;font-size:14px}button,a.action{border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:700;background:#5dc7a4;color:#0a1720;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#445b74;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}#status{padding:12px;border-radius:8px;background:#29394e;margin:12px 0}a{color:#9fddff} .amount{font-size:26px;font-weight:800} .empty{padding:35px;text-align:center;color:#b7c6d8}
</style></head><body><header><h1>🦑 서브마린 K방</h1><a href="/admin?admin=K">전체 관리자방 ↗</a></header><main>
<p class="hint">관리자 전용 · 실제 은행 입금을 확인한 뒤에만 승인하세요.</p>
<div id="status" role="status">결제요청 확인 중…</div>
<div class="actions"><button id="refresh" class="secondary">지금 새로고침</button><button id="notify" class="secondary">화면 알림 켜기</button><button id="testpush" class="secondary">테스트 푸시 발송</button></div>
<p class="hint">이 화면이 열려 있는 동안 10초마다 확인합니다. 화면을 닫아도 울리는 푸시 알림은 별도 서버 연동이 필요합니다.</p>
<section id="requests" aria-live="polite"></section></main>
<script>
"use strict";
const list=document.querySelector("#requests"),status=document.querySelector("#status");
let previous=null,busy=false;
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function refresh(){
 if(busy)return;busy=true;
 try{
  const r=await fetch("/api/admin/payments",{credentials:"same-origin",cache:"no-store"});
  if(r.status===401||r.status===403){status.textContent="관리자 로그인이 필요합니다. 상단 전체 관리자방에서 로그인해 주세요.";return}
  const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||"조회 실패");
  const pending=(j.payments||[]).filter(p=>p.status==="pending"&&(p.method==="bank"||p.method==="cash"));
  const ids=new Set(pending.map(p=>p.id));
  if(previous){const newly=pending.filter(p=>!previous.has(p.id));if(newly.length&&document.visibilityState==="visible"){status.textContent="새 결제요청 "+newly.length+"건!";if("Notification" in window&&Notification.permission==="granted"){new Notification("서브마린 결제요청",{body:"새 입금확인 요청 "+newly.length+"건",tag:"submarine-payment"})}}}
  previous=ids;
  status.textContent="입금확인 대기 "+pending.length+"건 · 마지막 확인 "+new Date().toLocaleTimeString("ko-KR");
  list.innerHTML=pending.length?pending.map(p=>'<article class="card"><div class="meta">'+escapeHtml(new Date(p.createdAt).toLocaleString("ko-KR"))+'</div><strong>'+escapeHtml(p.name||p.memberNo||"회원")+'</strong><div>'+escapeHtml(p.product||"상품")+' × '+escapeHtml(p.quantity||1)+'</div><div class="amount">'+won(p.amount)+'</div><div class="meta">입금자명: '+escapeHtml(p.payerName||"-")+'</div><div class="actions"><button data-id="'+escapeHtml(p.id)+'">실제 입금 확인 · 승인</button></div></article>').join(""):'<div class="empty">현재 대기 중인 현금결제가 없습니다.</div>';
 }catch(e){status.textContent="조회 오류: "+e.message}finally{busy=false}
}
list.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-id]");if(!b)return;
 if(!confirm("은행에 실제 입금된 것을 확인했습니까?\n승인하면 고객 포인트가 즉시 지급됩니다."))return;
 b.disabled=true;
 try{const r=await fetch("/api/admin/payments/complete",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.id})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||"승인 실패");alert("결제승인 완료 · 고객 충전 반영");previous=null;await refresh()}catch(e){alert("승인 실패: "+e.message);b.disabled=false}
});
document.querySelector("#testpush").onclick=async()=>{
 const b=document.querySelector("#testpush");b.disabled=true;
 try{const r=await fetch("/api/admin/k-push/test",{method:"POST",credentials:"same-origin"}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||"테스트 발송 실패");alert("등록된 관리자 휴대폰 "+j.attempted+"대에 테스트 알림 발송을 시도했습니다. 수신 여부를 확인하세요.")}catch(e){alert("테스트 실패: "+e.message)}finally{b.disabled=false}
};
document.querySelector("#refresh").onclick=refresh;
const decodeKey=s=>{const raw=atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length/4)*4,"="));return Uint8Array.from(raw,c=>c.charCodeAt(0))};
document.querySelector("#notify").textContent="이 휴대폰 푸시 알림 등록";
document.querySelector("#notify").onclick=async()=>{
 const btn=document.querySelector("#notify");btn.disabled=true;
 try{
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window))throw Error("현재 브라우저가 웹 푸시를 지원하지 않습니다.");
  if(Notification.permission==="denied")throw Error("브라우저 설정에서 이 사이트의 알림 권한을 먼저 허용해 주세요.");
  const permission=await Notification.requestPermission();if(permission!=="granted")throw Error("알림 권한이 허용되지 않았습니다.");
  const keyResponse=await fetch("/api/admin/k-push/public-key",{credentials:"same-origin",cache:"no-store"}),keyData=await keyResponse.json();
  if(!keyResponse.ok||!keyData.ok)throw Error(keyData.error||"서버 푸시 키 조회 실패");
  const reg=await navigator.serviceWorker.register("/admin-k-sw.js",{scope:"/"});
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(keyData.publicKey)});
  const r=await fetch("/api/admin/k-push/subscriptions",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON()})}),j=await r.json();
  if(!r.ok||!j.ok)throw Error(j.error||"구독 저장 실패");
  btn.textContent="이 휴대폰 알림 등록됨";
  alert("휴대폰 알림 수신 등록 완료. 실제 알림 발송은 서버 설정 및 발송 기능 연결 후 동작합니다.");
 }catch(e){alert("푸시 등록 실패: "+e.message)}finally{btn.disabled=false}
};
refresh();setInterval(refresh,10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
</script></body></html>
