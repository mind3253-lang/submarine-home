<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUBMARINE 관리자</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f3f5f7;color:#17212b}

.primary{background:#17212b;color:#fff}.schedule-admin{display:none}.schedule-admin.active{display:block}.sched-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.admincal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #e3e8ec;border-left:1px solid #e3e8ec;margin:16px 0}.admincal>div{border-right:1px solid #e3e8ec;border-bottom:1px solid #e3e8ec;padding:7px;min-height:80px;font-size:11px}.admincal .clickday{cursor:pointer}.admincal .clickday:hover{background:#eef5f8}.sched-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}.sched-modal.open{display:flex}.sched-modal-box{background:#fff;border-radius:14px;padding:24px;width:min(600px,calc(100% - 30px))}.admincal .head{min-height:auto;text-align:center;font-weight:700;background:#f5f7f8}.admincal .empty{background:#fafbfc}.admincal .n{font-weight:700;margin-bottom:4px}.sched-list{margin-top:18px}.sched-item{display:flex;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid #e5eaee}@media(max-width:700px){.sched-row{grid-template-columns:1fr 1fr}.sched-row .btn{grid-column:1/-1}}.note{font-size:13px;color:#6c7880}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.cat{border:1px solid #ccd4da;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}.cat.active{background:#17212b;color:#fff}.drop{border:2px dashed #c7d0d6;border-radius:12px;padding:25px;text-align:center;margin:8px 0 16px}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.pic{position:relative}.pic img{width:100%;height:120px;object-fit:cover;border-radius:9px}.pic button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:27px;height:27px;cursor:pointer}
#loginGate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}#loginBox{width:100%;max-width:390px;background:#fff;padding:30px;border-radius:14px}#adminApp{display:none}.error{color:#c62828;font-size:13px;margin-top:8px}
</style></head><body>

</div><div id="memberDbBox" class="box" style="display:none"><h2>회원 DB 테스트</h2><p class="note">테스트용 가상회원 10명 · 실제 회원 아님</p><div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:18px"><label>회원 검색<input id="moneyMemberSearch" placeholder="이름 · 전화번호 · 회원번호" oninput="searchMoneyMember()"></label><label>캐시 충전<input id="moneyCash" type="number" min="0" value="0"></label><label>포인트 지급<input id="moneyPoint" type="number" min="0" value="0"></label><button class="btn primary" onclick="addMemberMoney()">반영</button></div><div id="moneyMemberResults"></div><input id="moneyMemberNo" type="hidden"><div id="moneySelectedMember" class="note" style="margin-bottom:15px">회원을 선택하세요.</div><div id="memberTestList"></div><div id="adminMemberHistory" style="margin-top:20px"></div></div>
<div class="box"><h2>기능 메뉴 껍데기</h2><p>회원 DB · 캐시/포인트 원장 · 예약 · 취소/환불 · 약정서 · 강사 교육비 정산 · 교육자료실</p></div>
</main></div><script>
function adminLogin(){
 const id=document.getElementById('adminId').value.trim(), pw=document.getElementById('adminPw').value;
 const err=document.getElementById('loginError'); err.textContent='';
 if(!id || !pw){err.textContent='아이디와 비밀번호를 입력하세요.';return}
 sessionStorage.setItem('submarine_admin','1');
 document.getElementById('loginGate').style.display='none';
 document.getElementById('adminApp').style.display='block';
}
if(sessionStorage.getItem('submarine_admin')==='1'){document.getElementById('loginGate').style.display='none';document.getElementById('adminApp').style.display='block';}
document.getElementById('adminPw').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});
const testMembers=[
{no:'S0001',name:'김서연',gender:'여',phone:'010-0000-0001',free:'2레벨',mermaid:'-',scuba:'-',cash:200000,point:15000},
{no:'M0001',name:'이준호',gender:'남',phone:'010-0000-0002',free:'3레벨',mermaid:'-',scuba:'오픈워터',cash:100000,point:7000},
{no:'S0002',name:'박지민',gender:'여',phone:'010-0000-0003',free:'1레벨',mermaid:'베이직',scuba:'-',cash:300000,point:27000},
{no:'M0002',name:'최민석',gender:'남',phone:'010-0000-0004',free:'2레벨',mermaid:'-',scuba:'어드밴스',cash:500000,point:65000},
{no:'S0003',name:'정유진',gender:'여',phone:'010-0000-0005',free:'3레벨',mermaid:'-',scuba:'-',cash:40000,point:5000},
{no:'M0003',name:'강현우',gender:'남',phone:'010-0000-0006',free:'1레벨',mermaid:'-',scuba:'-',cash:55000,point:5000},
{no:'S0004',name:'한소희',gender:'여',phone:'010-0000-0007',free:'2레벨',mermaid:'베이직',scuba:'오픈워터',cash:200000,point:18000},
{no:'M0004',name:'윤태호',gender:'남',phone:'010-0000-0008',free:'4레벨',mermaid:'-',scuba:'레스큐',cash:300000,point:33000},
{no:'S0005',name:'오하늘',gender:'여',phone:'010-0000-0009',free:'1레벨',mermaid:'-',scuba:'-',cash:100000,point:5000},
{no:'M0005',name:'임도윤',gender:'남',phone:'010-0000-0010',free:'2레벨',mermaid:'-',scuba:'오픈워터',cash:500000,point:75000},
{no:'S0006',name:'김서연',gender:'여',phone:'010-0000-0011',free:'1레벨',mermaid:'-',scuba:'-',cash:100000,point:5000},
{no:'M0006',name:'최민석',gender:'남',phone:'010-0000-0012',free:'3레벨',mermaid:'-',scuba:'오픈워터',cash:200000,point:14000},
{no:'S0007',name:'박지민',gender:'여',phone:'010-0000-0013',free:'2레벨',mermaid:'베이직',scuba:'-',cash:300000,point:27000}
];
function searchMoneyMember(){const q=moneyMemberSearch.value.trim().toLowerCase();moneyMemberResults.innerHTML=q?testMembers.filter(m=>m.name.toLowerCase().includes(q)||m.phone.includes(q)||m.no.toLowerCase().includes(q)).map(m=>'<button class="btn" onclick="selectMoneyMember(\''+m.no+'\')">'+m.name+' · '+m.no+'</button>').join(''):''}
function selectMoneyMember(no){const m=testMembers.find(x=>x.no===no);moneyMemberNo.value=no;moneySelectedMember.textContent='선택: '+m.name+' · '+m.no;moneyMemberSearch.value=m.name;moneyMemberResults.innerHTML=''}
function ledger(){return JSON.parse(localStorage.getItem('submarine_ledger_v1')||'[]')}function addLedger(x){let l=ledger();l.push(Object.assign({id:Date.now(),at:new Date().toLocaleString('ko-KR')},x));localStorage.setItem('submarine_ledger_v1',JSON.stringify(l))}
function addMemberMoney(){if(!moneyMemberNo.value){alert('회원을 선택하세요.');return}const m=testMembers.find(x=>x.no===moneyMemberNo.value),s=memberState(),bal=s[m.no]||{cash:m.cash,point:m.point},cash=Math.max(0,Number(moneyCash.value)||0),point=Math.max(0,Number(moneyPoint.value)||0);bal.cash+=cash;bal.point+=point;s[m.no]=bal;localStorage.setItem('submarine_member_state_v1',JSON.stringify(s));if(cash)addLedger({memberNo:m.no,kind:'결제',cash:cash,point:0,note:'관리자 현금결제'});if(point)addLedger({memberNo:m.no,kind:'적립',cash:0,point:point,note:'관리자 포인트 지급'});drawTestMembers();showAdminHistory(m.no);moneyCash.value=0;moneyPoint.value=0;alert('캐시 '+cash.toLocaleString()+'원 / 포인트 '+point.toLocaleString()+'P 반영했습니다.')}
function historyRows(no){let rows=ledger().filter(x=>x.memberNo===no&&x.kind!=='사용');scheduleData().filter(x=>x.memberNo===no).forEach(x=>rows.push({at:x.date,kind:'사용',cash:0,point:0,note:x.time+' · '+x.people+'회 · '+x.type}));return rows}
let activeHistoryMember='';function showAdminHistory(no){activeHistoryMember=no;const m=testMembers.find(x=>x.no===no),rows=historyRows(no).reverse();adminMemberHistory.innerHTML='<h3>'+m.name+' 결제·사용내역</h3>'+(rows.length?rows.map(x=>'<div class="sched-item"><span>'+x.at+' · '+x.kind+' · '+x.note+'</span><strong>'+(x.cash?x.cash.toLocaleString()+'원 ':'')+(x.point?x.point.toLocaleString()+'P':'')+'</strong></div>').join(''):'<p class="note">내역이 없습니다.</p>')}
function drawTestMembers(){const el=document.getElementById('memberTestList');if(!el)return;const s=memberState();testMembers.forEach(m=>{if(s[m.no]){m.cash=s[m.no].cash;m.point=s[m.no].point}});el.innerHTML='<p class="note">회원 이름을 클릭하면 결제·사용내역이 열립니다.</p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>회원번호</th><th>이름</th><th>성별</th><th>전화</th><th>프리</th><th>머메이드</th><th>스쿠버</th><th>캐시</th><th>포인트</th></tr></thead><tbody>'+testMembers.map(m=>'<tr style="cursor:pointer" onclick="showAdminHistory(\''+m.no+'\')">'+[m.no,m.name,m.gender,m.phone,m.free,m.mermaid,m.scuba,m.cash.toLocaleString(),m.point.toLocaleString()+'P'].map(v=>'<td style="padding:9px;border-bottom:1px solid #e5eaee;white-space:nowrap">'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
drawTestMembers();
const slot=document.getElementById('slot'), body=document.getElementById('body'), inp=document.getElementById('images'), preview=document.getElementById('preview');
let currentImages=[];
const menus={
 A:[['A-1','A-1 소개'],['A-2','A-2 오시는 길'],['A-3','A-3 상품/결제']],
 B:[['B-1','B-1 이용 요금'],['B-2','B-2 할인 이용권'],['B-3','B-3 환불 규정']],
 C:[['C-1','C-1 현황'],['C-2','C-2 예약']],
 D:[['D-1','D-1 시설 약정서'],['D-2','D-2 교육 약정서']],
 E:[['E-1','E-1 회원'],['E-2','E-2 교육자료실']]
};
let currentCat='A';const defaultA3=[['체험 프리다이빙','27500',3],['체험 스쿠버다이빙','75000',4],['프다 1레벨 원데이 클래스','100000',5],['프다 1+2레벨 더블','230000',7],['상담 후 가격','',0]];function a3Data(){let d=JSON.parse(localStorage.getItem('submarine_a3_products')||'null');if(!d){d=Array.from({length:20},(_,i)=>i<5?{title:defaultA3[i][0],price:defaultA3[i][1],rate:defaultA3[i][2],desc:'',image:'',published:true}:{title:'',price:'',rate:0,desc:'',image:'',published:false});localStorage.setItem('submarine_a3_products',JSON.stringify(d))}return d}function drawA3Rows(){const d=a3Data();a3Rows.innerHTML='<h3>A-3 상품 게시판</h3><p class="note">설정된 상품만 홈페이지에 노출됩니다.</p>'+d.map((x,i)=>'<div style="display:grid;grid-template-columns:55px 1fr 90px;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #e5eaee;cursor:pointer" onclick="editA3Row('+i+')"><strong>'+(i+1)+'행</strong><span>'+(x.title||'미설정')+'</span><span>'+(x.published?'게시':'미게시')+'</span></div>').join('')}function editA3Row(i){const d=a3Data(),x=d[i],title=prompt((i+1)+'행 상품명',x.title);if(title===null)return;const price=prompt('가격 (숫자만, 상담상품은 비워도 됨)',x.price);if(price===null)return;const rate=prompt('캐시 적립률 %',x.rate);if(rate===null)return;const desc=prompt('설명',x.desc);if(desc===null)return;const pub=confirm('홈페이지에 게시할까요?\n확인=게시 / 취소=미게시');d[i]={...x,title,price,rate:Number(rate)||0,desc,published:pub};localStorage.setItem('submarine_a3_products',JSON.stringify(d));drawA3Rows();alert('저장했습니다.')}function addBoard(){}
function rewardRates(){return JSON.parse(localStorage.getItem('submarine_a3_reward_rates')||'[3,4,5,7]')}function loadRewardRates(){rewardRates().forEach((v,i)=>{const e=document.querySelector('.rewardRate[data-i="'+i+'"]');if(e)e.value=v})}function saveRewardRates(){localStorage.setItem('submarine_a3_reward_rates',JSON.stringify([...document.querySelectorAll('.rewardRate')].map(x=>Number(x.value)||0)));alert('적립률을 저장했습니다.')}
function setCat(cat,btn){currentCat=cat;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');const isC=cat==='C',isA3=cat==='A';document.getElementById('scheduleAdmin').classList.toggle('active',isC);document.getElementById('memberDbBox').style.display=isC?'block':'none';document.getElementById('contentEditor').style.display=isC?'none':'block';document.getElementById('normalEditor').style.display=isA3?'none':'block';document.getElementById('a3Rows').style.display=isA3?'block':'none';if(isA3){drawA3Rows()}else if(!isC){slot.innerHTML=menus[cat].map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');load()}if(isC)drawSchedules()}
function openSchedModal(date){schedDate.value=date;schedModalTitle.textContent=date+' 예약 등록';schedModal.classList.add('open')}
function closeSchedModal(){schedModal.classList.remove('open')}
function searchSchedMember(){const q=schedMemberSearch.value.trim().toLowerCase();schedMemberResults.innerHTML=q?testMembers.filter(m=>m.name.toLowerCase().includes(q)||m.phone.includes(q)||m.no.toLowerCase().includes(q)).map(m=>'<button class="btn" onclick="selectSchedMember(\''+m.no+'\')">'+m.name+' · '+m.no+' · '+m.phone+'</button>').join(''):''}
function selectSchedMember(no){const m=testMembers.find(x=>x.no===no);schedMemberNo.value=no;schedSelectedMember.textContent='선택: '+m.name+' · '+m.no;schedMemberResults.innerHTML='';schedMemberSearch.value=m.name}
function memberState(){let s=JSON.parse(localStorage.getItem('submarine_member_state_v1')||'null');if(!s){s=Object.fromEntries(testMembers.map(m=>[m.no,{cash:m.cash,point:m.point}]));localStorage.setItem('submarine_member_state_v1',JSON.stringify(s))}return s}
function scheduleData(){return JSON.parse(localStorage.getItem('submarine_schedules_v1')||'[]')}
function addSchedule(){if(!schedMemberNo.value){alert('회원을 선택하세요.');return}if(!schedDate.value){alert('날짜를 선택하세요.');return}const m=testMembers.find(x=>x.no===schedMemberNo.value),people=Number(schedPeople.value)||1,cost=40000*people,s=memberState(),bal=s[m.no]||{cash:m.cash,point:m.point};let usePoint=Math.min(bal.point,cost),remain=cost-usePoint,useCash=Math.min(bal.cash,remain);if(usePoint+useCash<cost){alert('캐시/포인트 잔액이 부족합니다.');return}bal.point-=usePoint;bal.cash-=useCash;s[m.no]=bal;localStorage.setItem('submarine_member_state_v1',JSON.stringify(s));const sid=Date.now();addLedger({memberNo:m.no,kind:'사용',cash:-useCash,point:-usePoint,note:schedDate.value+' · '+schedTime.value+' · '+people+'회 · '+schedType.value,scheduleId:sid});let a=scheduleData();a.push({id:sid,memberNo:m.no,memberName:m.name,date:schedDate.value,time:schedTime.value,type:schedType.value,people:people,cost:cost,usePoint:usePoint,useCash:useCash});localStorage.setItem('submarine_schedules_v1',JSON.stringify(a));drawSchedules();drawTestMembers();showAdminHistory(m.no);closeSchedModal();alert('등록했습니다. 포인트 '+usePoint.toLocaleString()+'P / 캐시 '+useCash.toLocaleString()+'원 차감')}
function removeSchedule(id){const all=scheduleData(),x=all.find(v=>v.id===id);if(x){let s=memberState(),m=testMembers.find(v=>v.no===x.memberNo),bal=s[x.memberNo]||{cash:m.cash,point:m.point};bal.point+=(x.usePoint||0);bal.cash+=(x.useCash||0);s[x.memberNo]=bal;localStorage.setItem('submarine_member_state_v1',JSON.stringify(s))}localStorage.setItem('submarine_schedules_v1',JSON.stringify(all.filter(x=>x.id!==id)));drawSchedules();drawTestMembers();if(activeHistoryMember)showAdminHistory(activeHistoryMember)}
let adminCalOffset=0;
function drawAdminCalendar(){const now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+adminCalOffset,1),last=new Date(first.getFullYear(),first.getMonth()+1,0),all=scheduleData();adminCalTitle.textContent=first.getFullYear()+'년 '+(first.getMonth()+1)+'월';let h=['일','월','화','수','목','금','토'].map(x=>'<div class="head">'+x+'</div>').join('');for(let i=0;i<first.getDay();i++)h+='<div class="empty"></div>';for(let d=1;d<=last.getDate();d++){let key=first.getFullYear()+'-'+String(first.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),items=all.filter(x=>x.date===key);h+='<div class="clickday" onclick="openSchedModal(\''+key+'\')"><div class="n">'+d+'</div>'+items.map(x=>x.time+' '+x.type+' '+x.people+'명').join('<br>')+'</div>'}adminCalendar.innerHTML=h}
function drawSchedules(){if(!document.getElementById('schedList'))return;const a=scheduleData().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));drawAdminCalendar();schedList.innerHTML=a.length?a.map(x=>'<div class="sched-item"><span><strong>'+x.date+'</strong> · '+x.time+' · '+x.type+' · '+x.people+'명 · '+(x.memberName||'회원 미지정')+'</span><button class="btn" onclick="removeSchedule('+x.id+')">삭제</button></div>').join(''):'<p class="note">등록된 스케줄이 없습니다.</p>'}
function data(){return JSON.parse(localStorage.getItem('submarine_contents_v2')||'{}')}
function draw(){preview.innerHTML='';currentImages.forEach((src,i)=>{let d=document.createElement('div');d.className='pic';d.innerHTML='<img src="'+src+'"><button onclick="removeImg('+i+')">×</button>';preview.appendChild(d)})}
function removeImg(i){currentImages.splice(i,1);draw()}
function load(){let item=data()[slot.value]||{};body.value=item.body||'';currentImages=item.images||[];draw()}
slot.onchange=load; setCat('A',document.querySelector('[data-cat="A"]'));
inp.onchange=async function(){
 for(const f of [...inp.files]){
   if(f.size>2500000){alert(f.name+' 파일이 큽니다. 2.5MB 이하 이미지를 올려주세요.');continue}
   currentImages.push(await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)}));
 }
 draw(); inp.value='';
}
function save(){
 let d=data(); d[slot.value]={body:body.value,images:currentImages};
 try{localStorage.setItem('submarine_contents_v2',JSON.stringify(d));alert('저장했습니다. 홈페이지에서 확인하세요.')}
 catch(e){alert('브라우저 저장공간이 부족합니다. 테스트판에서는 이미지 크기/수를 줄여주세요. 실제 서버판은 파일 저장소를 사용합니다.')}
}
</script></body></html>
