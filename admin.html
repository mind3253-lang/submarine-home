<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUBMARINE 관리자</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f3f5f7;color:#17212b}
header{height:70px;background:#17212b;color:#fff;display:flex;align-items:center;padding:0 28px;font-weight:700}
main{max-width:1100px;margin:30px auto;padding:0 20px}.box{background:#fff;padding:28px;border-radius:14px;margin-bottom:20px}
select,input,textarea{width:100%;padding:12px;margin:7px 0 16px;border:1px solid #ccd4da;border-radius:7px;font:inherit}
textarea{min-height:280px;line-height:1.7}.btn{border:0;border-radius:7px;padding:12px 18px;cursor:pointer;margin-right:6px}
.primary{background:#17212b;color:#fff}.schedule-admin{display:none}.schedule-admin.active{display:block}.sched-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.sched-list{margin-top:18px}.sched-item{display:flex;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid #e5eaee}@media(max-width:700px){.sched-row{grid-template-columns:1fr 1fr}.sched-row .btn{grid-column:1/-1}}.note{font-size:13px;color:#6c7880}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.cat{border:1px solid #ccd4da;background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}.cat.active{background:#17212b;color:#fff}.drop{border:2px dashed #c7d0d6;border-radius:12px;padding:25px;text-align:center;margin:8px 0 16px}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.pic{position:relative}.pic img{width:100%;height:120px;object-fit:cover;border-radius:9px}.pic button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:27px;height:27px;cursor:pointer}
#loginGate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}#loginBox{width:100%;max-width:390px;background:#fff;padding:30px;border-radius:14px}#adminApp{display:none}.error{color:#c62828;font-size:13px;margin-top:8px}
</style></head><body>
<div id="loginGate"><div id="loginBox"><h2>관리자 로그인</h2><label>아이디</label><input id="adminId" autocomplete="username"><label>비밀번호</label><input id="adminPw" type="password" autocomplete="current-password"><button class="btn primary" onclick="adminLogin()">로그인</button><div id="loginError" class="error"></div></div></div><div id="adminApp">
<header><a href="index.html" style="color:#fff;text-decoration:none;cursor:pointer">SUBMARINE</a><span style="margin-left:10px">· 관리자 페이지</span></header><main>
<div class="box"><h2>콘텐츠 관리</h2>
<div class="cats">
<button class="cat active" data-cat="A" onclick="setCat('A',this)">A · 서브마린</button>
<button class="cat" data-cat="B" onclick="setCat('B',this)">B · 이용안내</button>
<button class="cat" data-cat="C" onclick="setCat('C',this)">C · 스케줄</button>
<button class="cat" data-cat="D" onclick="setCat('D',this)">D · 약정서</button>
<button class="cat" data-cat="E" onclick="setCat('E',this)">E · 회원관리</button>
</div>
<p class="note">카테고리를 선택한 뒤 해당 게시판을 편집합니다.</p>
<div id="scheduleAdmin" class="schedule-admin"><h3>스케줄 등록 테스트</h3><label>회원 검색<input id="schedMemberSearch" placeholder="이름 · 전화번호 · 회원번호" oninput="searchSchedMember()"></label><div id="schedMemberResults" style="margin:-8px 0 16px"></div><input id="schedMemberNo" type="hidden"><div id="schedSelectedMember" class="note" style="margin-bottom:12px">회원을 선택하세요.</div><div class="sched-row"><label>날짜<input id="schedDate" type="date"></label><label>타임<select id="schedTime"><option>1타임</option><option>2타임</option><option>3타임</option><option>4타임</option><option>5타임</option></select></label><label>구분<select id="schedType"><option>강습</option><option>스킬업</option><option>펀다</option><option>독립군</option></select></label><label>확정 인원<input id="schedPeople" type="number" min="1" value="1"></label><button class="btn primary" onclick="addSchedule()">등록</button></div><div id="schedList" class="sched-list"></div></div>
<div id="contentEditor">
<label>게시판 선택</label><select id="slot"></select>
<label>이미지</label>
<div class="drop"><input id="images" type="file" accept="image/*" multiple><div>여러 장 선택 가능</div></div>
<div id="preview" class="preview"></div>
<label>본문</label><textarea id="body" placeholder="텍스트를 입력하세요."></textarea>
<button class="btn primary" onclick="save()">저장</button><button class="btn" onclick="location.href='index.html'">홈페이지 보기</button>
</div>
</div><div class="box"><h2>회원 DB 테스트</h2><p class="note">테스트용 가상회원 10명 · 실제 회원 아님</p><div id="memberTestList"></div></div>
<div class="box"><h2>기능 메뉴 껍데기</h2><p>회원 DB · 캐시/포인트 원장 · 예약 · 취소/환불 · 약정서 · 강사 교육비 정산 · 교육자료실</p></div>
</main></div><script>
function adminLogin(){
 const id=document.getElementById('adminId').value.trim(), pw=document.getElementById('adminPw').value;
 const err=document.getElementById('loginError'); err.textContent='';
 if(!id || !pw){err.textContent='아이디와 비밀번호를 입력하세요.';return}
 sessionStorage.setItem('submarine_admin','1');
 document.getElementById('loginGate').style.display='none';
 document.getElementById('adminApp').style.display='block';
}
if(sessionStorage.getItem('submarine_admin')==='1'){document.getElementById('loginGate').style.display='none';document.getElementById('adminApp').style.display='block';}
document.getElementById('adminPw').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});
const testMembers=[
{no:'S0001',name:'김서연',gender:'여',phone:'010-0000-0001',free:'2레벨',mermaid:'-',scuba:'-',cash:200000,point:15000},
{no:'M0001',name:'이준호',gender:'남',phone:'010-0000-0002',free:'3레벨',mermaid:'-',scuba:'오픈워터',cash:100000,point:7000},
{no:'S0002',name:'박지민',gender:'여',phone:'010-0000-0003',free:'1레벨',mermaid:'베이직',scuba:'-',cash:300000,point:27000},
{no:'M0002',name:'최민석',gender:'남',phone:'010-0000-0004',free:'2레벨',mermaid:'-',scuba:'어드밴스',cash:500000,point:65000},
{no:'S0003',name:'정유진',gender:'여',phone:'010-0000-0005',free:'3레벨',mermaid:'-',scuba:'-',cash:40000,point:5000},
{no:'M0003',name:'강현우',gender:'남',phone:'010-0000-0006',free:'1레벨',mermaid:'-',scuba:'-',cash:55000,point:5000},
{no:'S0004',name:'한소희',gender:'여',phone:'010-0000-0007',free:'2레벨',mermaid:'베이직',scuba:'오픈워터',cash:200000,point:18000},
{no:'M0004',name:'윤태호',gender:'남',phone:'010-0000-0008',free:'4레벨',mermaid:'-',scuba:'레스큐',cash:300000,point:33000},
{no:'S0005',name:'오하늘',gender:'여',phone:'010-0000-0009',free:'1레벨',mermaid:'-',scuba:'-',cash:100000,point:5000},
{no:'M0005',name:'임도윤',gender:'남',phone:'010-0000-0010',free:'2레벨',mermaid:'-',scuba:'오픈워터',cash:500000,point:75000}
];
function drawTestMembers(){const el=document.getElementById('memberTestList');if(!el)return;el.innerHTML='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>회원번호</th><th>이름</th><th>성별</th><th>전화</th><th>프리</th><th>머메이드</th><th>스쿠버</th><th>캐시</th><th>포인트</th></tr></thead><tbody>'+testMembers.map(m=>'<tr>'+[m.no,m.name,m.gender,m.phone,m.free,m.mermaid,m.scuba,m.cash.toLocaleString(),m.point.toLocaleString()+'P'].map(v=>'<td style="padding:9px;border-bottom:1px solid #e5eaee;white-space:nowrap">'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
drawTestMembers();
const slot=document.getElementById('slot'), body=document.getElementById('body'), inp=document.getElementById('images'), preview=document.getElementById('preview');
let currentImages=[];
const menus={
 A:[['A-1','A-1 소개'],['A-2','A-2 오시는 길']],
 B:[['B-1','B-1 이용 요금'],['B-2','B-2 할인 이용권'],['B-3','B-3 환불 규정']],
 C:[['C-1','C-1 현황'],['C-2','C-2 예약']],
 D:[['D-1','D-1 시설 약정서'],['D-2','D-2 교육 약정서']],
 E:[['E-1','E-1 정규 회원'],['E-2','E-2 독립군 회원'],['E-3','E-3 교육자료실']]
};
function setCat(cat,btn){
 document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active')); if(btn)btn.classList.add('active');
 const isC=cat==='C'; document.getElementById('scheduleAdmin').classList.toggle('active',isC); document.getElementById('contentEditor').style.display=isC?'none':'block';
 slot.innerHTML=menus[cat].map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join(''); load(); if(isC)drawSchedules();
}
function searchSchedMember(){const q=schedMemberSearch.value.trim().toLowerCase();schedMemberResults.innerHTML=q?testMembers.filter(m=>m.name.toLowerCase().includes(q)||m.phone.includes(q)||m.no.toLowerCase().includes(q)).map(m=>'<button class="btn" onclick="selectSchedMember(\''+m.no+'\')">'+m.name+' · '+m.no+' · '+m.phone+'</button>').join(''):''}
function selectSchedMember(no){const m=testMembers.find(x=>x.no===no);schedMemberNo.value=no;schedSelectedMember.textContent='선택: '+m.name+' · '+m.no;schedMemberResults.innerHTML='';schedMemberSearch.value=m.name}
function scheduleData(){return JSON.parse(localStorage.getItem('submarine_schedules_v1')||'[]')}
function addSchedule(){if(!schedMemberNo.value){alert('회원을 선택하세요.');return}if(!schedDate.value){alert('날짜를 선택하세요.');return}const m=testMembers.find(x=>x.no===schedMemberNo.value);let a=scheduleData();a.push({id:Date.now(),memberNo:m.no,memberName:m.name,date:schedDate.value,time:schedTime.value,type:schedType.value,people:Number(schedPeople.value)||1});localStorage.setItem('submarine_schedules_v1',JSON.stringify(a));drawSchedules();alert('등록했습니다.')}
function removeSchedule(id){localStorage.setItem('submarine_schedules_v1',JSON.stringify(scheduleData().filter(x=>x.id!==id)));drawSchedules()}
function drawSchedules(){if(!document.getElementById('schedList'))return;const a=scheduleData().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));schedList.innerHTML=a.length?a.map(x=>'<div class="sched-item"><span><strong>'+x.date+'</strong> · '+x.time+' · '+x.type+' · '+x.people+'명 · '+(x.memberName||'회원 미지정')+'</span><button class="btn" onclick="removeSchedule('+x.id+')">삭제</button></div>').join(''):'<p class="note">등록된 스케줄이 없습니다.</p>'}
function data(){return JSON.parse(localStorage.getItem('submarine_contents_v2')||'{}')}
function draw(){preview.innerHTML='';currentImages.forEach((src,i)=>{let d=document.createElement('div');d.className='pic';d.innerHTML='<img src="'+src+'"><button onclick="removeImg('+i+')">×</button>';preview.appendChild(d)})}
function removeImg(i){currentImages.splice(i,1);draw()}
function load(){let item=data()[slot.value]||{};body.value=item.body||'';currentImages=item.images||[];draw()}
slot.onchange=load; setCat('A',document.querySelector('[data-cat="A"]'));
inp.onchange=async function(){
 for(const f of [...inp.files]){
   if(f.size>1500000){alert(f.name+' 파일이 큽니다. 테스트판은 1.5MB 이하 이미지를 권장합니다.');continue}
   currentImages.push(await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)}));
 }
 draw(); inp.value='';
}
function save(){
 let d=data(); d[slot.value]={body:body.value,images:currentImages};
 try{localStorage.setItem('submarine_contents_v2',JSON.stringify(d));alert('저장했습니다. 홈페이지에서 확인하세요.')}
 catch(e){alert('브라우저 저장공간이 부족합니다. 테스트판에서는 이미지 크기/수를 줄여주세요. 실제 서버판은 파일 저장소를 사용합니다.')}
}
</script></body></html>
