<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUBMARINE 관리자</title><style>

#loginGate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}#loginBox{width:100%;max-width:390px;background:#fff;padding:30px;border-radius:14px}#adminApp{display:none}.error{color:#c62828;font-size:13px;margin-top:8px}
</style></head><body>

<header><a href="index.html" style="color:#fff;text-decoration:none;cursor:pointer">SUBMARINE</a><span style="margin-left:10px">· 관리자 페이지</span></header><main>
<div class="box"><h2>콘텐츠 관리</h2>
<div class="cats">

<p class="note">카테고리를 선택한 뒤 해당 게시판을 편집합니다.</p>
<div id="scheduleAdmin" class="schedule-admin"><h3>스케줄 등록 테스트</h3><div style="display:flex;justify-content:space-between;align-items:center"><button class="btn" onclick="adminCalOffset=0;drawAdminCalendar()">← 이번 달</button><strong id="adminCalTitle"></strong><button class="btn" onclick="adminCalOffset=1;drawAdminCalendar()">다음 달 →</button></div><div id="adminCalendar" class="admincal"></div><div id="schedModal" class="sched-modal"><div class="sched-modal-box"><button class="btn" onclick="closeSchedModal()" style="float:right">×</button><h3 id="schedModalTitle">예약 등록</h3><label>회원 검색<input id="schedMemberSearch" placeholder="이름 · 전화번호 · 회원번호" oninput="searchSchedMember()"></label><div id="schedMemberResults" style="margin:-8px 0 16px"></div><input id="schedMemberNo" type="hidden"><div id="schedSelectedMember" class="note" style="margin-bottom:12px">회원을 선택하세요.</div><div class="sched-row"><label>날짜<input id="schedDate" type="date"></label><label>타임<select id="schedTime"><option>1타임</option><option>2타임</option><option>3타임</option><option>4타임</option><option>5타임</option></select></label><label>구분<select id="schedType"><option>강습</option><option>스킬업</option><option>펀다</option><option>독립군</option></select></label><label>확정 인원<input id="schedPeople" type="number" min="1" value="1"></label><button class="btn primary" onclick="addSchedule()">등록</button></div></div></div><div id="schedList" class="sched-list"></div></div>
<div id="contentEditor"><label>게시판 선택</label><select id="slot"></select><div id="normalEditor"><label>이미지</label><div class="drop"><input id="images" type="file" accept="image/*" multiple><div>여러 장 선택 가능 · 파일당 2.5MB 이하</div></div><div id="preview" class="preview"></div><label>본문</label><textarea id="body" placeholder="텍스트를 입력하세요."></textarea><button class="btn primary" onclick="save()">저장</button><button class="btn" onclick="location.href='index.html'">홈페이지 보기</button></div><div id="a3Rows" style="display:none"></div><div id="a3Modal" class="sched-modal"><div class="sched-modal-box"><button class="btn" onclick="closeA3Modal()" style="float:right">×</button><h3 id="a3ModalTitle">상품 수정</h3><label>상품명<input id="a3Title"></label><label>가격<input id="a3Price" type="number"></label><label>NPAY 적립률 (%)<input id="a3Npay" type="number" step="0.1"></label><label>현금 적립률 (%)<input id="a3Rate" type="number" step="0.1"></label><label>설명<textarea id="a3Desc"></textarea></label><label>썸네일 이미지<input id="a3Image" type="file" accept="image/*"></label><div id="a3ImagePreview"></div><label><input id="a3Published" type="checkbox"> 홈페이지 게시</label><button id="a3SaveBtn" type="button" class="btn primary">저장</button></div></div></div>
</div><div id="instructorBox" class="box" style="display:none"><h2>F · 강사정산</h2><p class="note">C 회원관리에서 필요한 회원만 찾아 F 강사정산 목록으로 불러옵니다.</p><div style="margin-bottom:18px"><label>회원에서 강사 불러오기<input id="instructorMemberSearch" placeholder="이름 · 전화번호 · 회원번호" oninput="searchInstructorMember()"></label><div id="instructorMemberResults"></div></div><label>등록된 강사 검색<input id="instructorSearch" placeholder="이름 · 회원번호" oninput="drawInstructors()"></label><div id="instructorList"></div><div id="instructorEntry" style="display:none;margin-top:22px;padding-top:18px;border-top:1px solid #e5eaee"><h3 id="instructorEntryTitle">강사 정산 등록</h3><div style="display:grid;grid-template-columns:1.2fr repeat(6,1fr);gap:8px;align-items:end"><label>일자<input id="instDate" type="date"></label><label>바우처<input id="instVoucher" type="number" min="0" value="0"></label><label>체험<input id="instExperience" type="number" min="0" value="0"></label><label>강습<input id="instLesson" type="number" min="0" value="0"></label><label>스킬업<input id="instSkillup" type="number" min="0" value="0"></label><label>성공보수<input id="instSuccess" type="number" min="0" value="0"></label><label>3레벨교육<input id="instLevel3" type="number" min="0" value="0"></label></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px;margin-top:8px"><label>입장권 차감액<input id="instTicketDeduct" type="number" min="0" value="0" placeholder="예: 400000"></label><label>강습대가 지급방식<select id="instPayMethod"><option value="cash">현금정산</option><option value="mileage">마일리지 지급</option></select></label></div><button class="btn primary" onclick="addInstructorSettlement()">등록</button><div id="instructorSettlementList" style="margin-top:18px"></div><div id="instructorClosing" style="margin-top:20px"></div></div></div><div id="memberDbBox" class="box" style="display:none"><h2>회원 DB 테스트</h2><p class="note">테스트용 가상회원 10명 · 실제 회원 아님</p><div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:18px"><label>회원 검색<input id="moneyMemberSearch" placeholder="이름 · 전화번호 · 회원번호" oninput="searchMoneyMember()"></label><label>캐시 충전<input id="moneyCash" type="number" min="0" value="0"></label><label>포인트 지급<input id="moneyPoint" type="number" min="0" value="0"></label><button class="btn primary" onclick="addMemberMoney()">반영</button></div><div id="moneyMemberResults"></div><input id="moneyMemberNo" type="hidden"><div id="moneySelectedMember" class="note" style="margin-bottom:15px">회원을 선택하세요.</div><div id="memberTestList"></div><div id="adminMemberHistory" style="margin-top:20px"></div></div>
<div class="box"><h2>기능 메뉴 껍데기</h2><p>회원 DB · 캐시/포인트 원장 · 예약 · 취소/환불 · 약정서 · 강사 교육비 정산 · 교육자료실</p></div>
</main></div><script>

const testMembers=[
{no:'S0001',name:'김서연',gender:'여',phone:'010-0000-0001',free:'2레벨',mermaid:'-',scuba:'-',cash:200000,point:15000},
{no:'M0001',name:'이준호',gender:'남',phone:'010-0000-0002',free:'3레벨',mermaid:'-',scuba:'오픈워터',cash:100000,point:7000},
{no:'S0002',name:'박지민',gender:'여',phone:'010-0000-0003',free:'1레벨',mermaid:'베이직',scuba:'-',cash:300000,point:27000},
{no:'M0002',name:'최민석',gender:'남',phone:'010-0000-0004',free:'2레벨',mermaid:'-',scuba:'어드밴스',cash:500000,point:65000},
{no:'S0003',name:'정유진',gender:'여',phone:'010-0000-0005',free:'3레벨',mermaid:'-',scuba:'-',cash:40000,point:5000},
{no:'M0003',name:'강현우',gender:'남',phone:'010-0000-0006',free:'1레벨',mermaid:'-',scuba:'-',cash:55000,point:5000},
{no:'S0004',name:'한소희',gender:'여',phone:'010-0000-0007',free:'2레벨',mermaid:'베이직',scuba:'오픈워터',cash:200000,point:18000},
{no:'M0004',name:'윤태호',gender:'남',phone:'010-0000-0008',free:'4레벨',mermaid:'-',scuba:'레스큐',cash:300000,point:33000},
{no:'S0005',name:'오하늘',gender:'여',phone:'010-0000-0009',free:'1레벨',mermaid:'-',scuba:'-',cash:100000,point:5000},
{no:'M0005',name:'임도윤',gender:'남',phone:'010-0000-0010',free:'2레벨',mermaid:'-',scuba:'오픈워터',cash:500000,point:75000},
{no:'S0006',name:'김서연',gender:'여',phone:'010-0000-0011',free:'1레벨',mermaid:'-',scuba:'-',cash:100000,point:5000},
{no:'M0006',name:'최민석',gender:'남',phone:'010-0000-0012',free:'3레벨',mermaid:'-',scuba:'오픈워터',cash:200000,point:14000},
{no:'S0007',name:'박지민',gender:'여',phone:'010-0000-0013',free:'2레벨',mermaid:'베이직',scuba:'-',cash:300000,point:27000}
];
function openSchedModal(date){schedDate.value=date;schedModalTitle.textContent=date+' 예약 등록';schedModal.classList.add('open')}
function closeSchedModal(){schedModal.classList.remove('open')}
function searchSchedMember(){const q=schedMemberSearch.value.trim().toLowerCase();schedMemberResults.innerHTML=q?testMembers.filter(m=>m.name.toLowerCase().includes(q)||m.phone.includes(q)||m.no.toLowerCase().includes(q)).map(m=>'<button class="btn" onclick="selectSchedMember(\''+m.no+'\')">'+m.name+' · '+m.no+' · '+m.phone+'</button>').join(''):''}
function selectSchedMember(no){const m=testMembers.find(x=>x.no===no);schedMemberNo.value=no;schedSelectedMember.textContent='선택: '+m.name+' · '+m.no;schedMemberResults.innerHTML='';schedMemberSearch.value=m.name}
function memberState(){let s=JSON.parse(localStorage.getItem('submarine_member_state_v1')||'null');if(!s){s=Object.fromEntries(testMembers.map(m=>[m.no,{cash:m.cash,point:m.point}]));localStorage.setItem('submarine_member_state_v1',JSON.stringify(s))}return s}
function scheduleData(){return JSON.parse(localStorage.getItem('submarine_schedules_v1')||'[]')}
function addSchedule(){if(!schedMemberNo.value){alert('회원을 선택하세요.');return}if(!schedDate.value){alert('날짜를 선택하세요.');return}const m=testMembers.find(x=>x.no===schedMemberNo.value),people=Number(schedPeople.value)||1,cost=40000*people,s=memberState(),bal=s[m.no]||{cash:m.cash,point:m.point};let usePoint=Math.min(bal.point,cost),remain=cost-usePoint,useCash=Math.min(bal.cash,remain);if(usePoint+useCash<cost){alert('캐시/포인트 잔액이 부족합니다.');return}bal.point-=usePoint;bal.cash-=useCash;s[m.no]=bal;localStorage.setItem('submarine_member_state_v1',JSON.stringify(s));const sid=Date.now();addLedger({memberNo:m.no,kind:'사용',cash:-useCash,point:-usePoint,note:schedDate.value+' · '+schedTime.value+' · '+people+'회 · '+schedType.value,scheduleId:sid});let a=scheduleData();a.push({id:sid,memberNo:m.no,memberName:m.name,date:schedDate.value,time:schedTime.value,type:schedType.value,people:people,cost:cost,usePoint:usePoint,useCash:useCash});localStorage.setItem('submarine_schedules_v1',JSON.stringify(a));drawSchedules();drawTestMembers();showAdminHistory(m.no);closeSchedModal();alert('등록했습니다. 포인트 '+usePoint.toLocaleString()+'P / 캐시 '+useCash.toLocaleString()+'원 차감')}
function removeSchedule(id){const all=scheduleData(),x=all.find(v=>v.id===id);if(x){let s=memberState(),m=testMembers.find(v=>v.no===x.memberNo),bal=s[x.memberNo]||{cash:m.cash,point:m.point};bal.point+=(x.usePoint||0);bal.cash+=(x.useCash||0);s[x.memberNo]=bal;localStorage.setItem('submarine_member_state_v1',JSON.stringify(s))}localStorage.setItem('submarine_schedules_v1',JSON.stringify(all.filter(x=>x.id!==id)));drawSchedules();drawTestMembers();if(activeHistoryMember)showAdminHistory(activeHistoryMember)}
let adminCalOffset=0;
function drawAdminCalendar(){const now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+adminCalOffset,1),last=new Date(first.getFullYear(),first.getMonth()+1,0),all=scheduleData();adminCalTitle.textContent=first.getFullYear()+'년 '+(first.getMonth()+1)+'월';let h=['일','월','화','수','목','금','토'].map(x=>'<div class="head">'+x+'</div>').join('');for(let i=0;i<first.getDay();i++)h+='<div class="empty"></div>';for(let d=1;d<=last.getDate();d++){let key=first.getFullYear()+'-'+String(first.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),items=all.filter(x=>x.date===key);h+='<div class="clickday" onclick="openSchedModal(\''+key+'\')"><div class="n">'+d+'</div>'+items.map(x=>x.time+' '+x.type+' '+x.people+'명').join('<br>')+'</div>'}adminCalendar.innerHTML=h}
function drawSchedules(){if(!document.getElementById('schedList'))return;const a=scheduleData().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));drawAdminCalendar();schedList.innerHTML=a.length?a.map(x=>'<div class="sched-item"><span><strong>'+x.date+'</strong> · '+x.time+' · '+x.type+' · '+x.people+'명 · '+(x.memberName||'회원 미지정')+'</span><button class="btn" onclick="removeSchedule('+x.id+')">삭제</button></div>').join(''):'<p class="note">등록된 스케줄이 없습니다.</p>'}

function searchMoneyMember(){const q=moneyMemberSearch.value.trim().toLowerCase();moneyMemberResults.innerHTML=q?testMembers.filter(m=>m.name.toLowerCase().includes(q)||m.phone.includes(q)||m.no.toLowerCase().includes(q)).map(m=>'<button class="btn" onclick="selectMoneyMember(\''+m.no+'\')">'+m.name+' · '+m.no+'</button>').join(''):''}
function selectMoneyMember(no){const m=testMembers.find(x=>x.no===no);moneyMemberNo.value=no;moneySelectedMember.textContent='선택: '+m.name+' · '+m.no;moneyMemberSearch.value=m.name;moneyMemberResults.innerHTML=''}
function ledger(){return JSON.parse(localStorage.getItem('submarine_ledger_v1')||'[]')}function addLedger(x){let l=ledger();l.push(Object.assign({id:Date.now(),at:new Date().toLocaleString('ko-KR')},x));localStorage.setItem('submarine_ledger_v1',JSON.stringify(l))}
function addMemberMoney(){if(!moneyMemberNo.value){alert('회원을 선택하세요.');return}const m=testMembers.find(x=>x.no===moneyMemberNo.value),s=memberState(),bal=s[m.no]||{cash:m.cash,point:m.point},cash=Math.max(0,Number(moneyCash.value)||0),point=Math.max(0,Number(moneyPoint.value)||0);bal.cash+=cash;bal.point+=point;s[m.no]=bal;localStorage.setItem('submarine_member_state_v1',JSON.stringify(s));if(cash)addLedger({memberNo:m.no,kind:'결제',cash:cash,point:0,note:'관리자 현금결제'});if(point)addLedger({memberNo:m.no,kind:'적립',cash:0,point:point,note:'관리자 포인트 지급'});drawTestMembers();showAdminHistory(m.no);moneyCash.value=0;moneyPoint.value=0;alert('캐시 '+cash.toLocaleString()+'원 / 포인트 '+point.toLocaleString()+'P 반영했습니다.')}
function historyRows(no){let rows=ledger().filter(x=>x.memberNo===no&&x.kind!=='사용');scheduleData().filter(x=>x.memberNo===no).forEach(x=>rows.push({at:x.date,kind:'사용',cash:0,point:0,note:x.time+' · '+x.people+'회 · '+x.type}));return rows}
let activeHistoryMember='';function showAdminHistory(no){activeHistoryMember=no;const m=testMembers.find(x=>x.no===no),rows=historyRows(no).reverse();adminMemberHistory.innerHTML='<h3>'+m.name+' 결제·사용내역</h3>'+(rows.length?rows.map(x=>'<div class="sched-item"><span>'+x.at+' · '+x.kind+' · '+x.note+'</span><strong>'+(x.cash?x.cash.toLocaleString()+'원 ':'')+(x.point?x.point.toLocaleString()+'P':'')+'</strong></div>').join(''):'<p class="note">내역이 없습니다.</p>')}
function drawTestMembers(){const el=document.getElementById('memberTestList');if(!el)return;const s=memberState();testMembers.forEach(m=>{if(s[m.no]){m.cash=s[m.no].cash;m.point=s[m.no].point}});el.innerHTML='<p class="note">회원 이름을 클릭하면 결제·사용내역이 열립니다.</p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>회원번호</th><th>이름</th><th>성별</th><th>전화</th><th>프리</th><th>머메이드</th><th>스쿠버</th><th>캐시</th><th>포인트</th></tr></thead><tbody>'+testMembers.map(m=>'<tr style="cursor:pointer" onclick="showAdminHistory(\''+m.no+'\')">'+[m.no,m.name,m.gender,m.phone,m.free,m.mermaid,m.scuba,m.cash.toLocaleString(),m.point.toLocaleString()+'P'].map(v=>'<td style="padding:9px;border-bottom:1px solid #e5eaee;white-space:nowrap">'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
drawTestMembers();
function data(){try{return JSON.parse(localStorage.getItem('submarine_contents_v2')||'{}')}catch(e){return {}}}
function draw(){const p=document.getElementById('preview');p.innerHTML='';currentImages.forEach((src,i)=>{const d=document.createElement('div');d.className='pic';d.innerHTML='<img src="'+src+'"><button type="button" onclick="removeImg('+i+')">×</button>';p.appendChild(d)})}
function removeImg(i){currentImages.splice(i,1);draw()}
function load(){const item=data()[slot.value]||{};body.value=item.body||'';currentImages=item.images||[];draw()}
const slot=document.getElementById('slot'), body=document.getElementById('body'), inp=document.getElementById('images'), preview=document.getElementById('preview'), scheduleAdmin=document.getElementById('scheduleAdmin'), memberDbBox=document.getElementById('memberDbBox'), contentEditor=document.getElementById('contentEditor'), normalEditor=document.getElementById('normalEditor'), a3Rows=document.getElementById('a3Rows'), a3Modal=document.getElementById('a3Modal'), a3ModalTitle=document.getElementById('a3ModalTitle'), a3Title=document.getElementById('a3Title'), a3Price=document.getElementById('a3Price'), a3Npay=document.getElementById('a3Npay'), a3Rate=document.getElementById('a3Rate'), a3Desc=document.getElementById('a3Desc'), a3Published=document.getElementById('a3Published'), a3ImagePreview=document.getElementById('a3ImagePreview');

function addInstructorSettlement(){const x=instructorData().find(v=>v.id===activeInstructorId);if(!x){alert('강사를 선택하세요.');return}if(!instDate.value){alert('일자를 선택하세요.');return}const counts=settlementCounts();if(!Object.values(counts).some(v=>v>0)){alert('인원수를 입력하세요.');return}const amount=settlementAmount(x,counts),ticketDeduct=Math.max(0,Number(instTicketDeduct.value)||0),payMethod=instPayMethod.value;let a=instructorSettlements();if(editingSettlementId){const i=a.findIndex(v=>v.id===editingSettlementId);if(i>=0)a[i]={...a[i],date:instDate.value,counts:counts,amount:amount,ticketDeduct:ticketDeduct,payMethod:payMethod};}else a.push({id:Date.now(),instructorId:x.id,memberNo:x.memberNo,name:x.name,date:instDate.value,counts:counts,amount:amount,ticketDeduct:ticketDeduct,payMethod:payMethod});saveInstructorSettlements(a);clearSettlementForm();drawInstructorSettlements()}
function editSettlement(id){const r=instructorSettlements().find(v=>v.id===id);if(!r)return;editingSettlementId=id;instDate.value=r.date;instVoucher.value=r.counts?.voucher||0;instExperience.value=r.counts?.experience||0;instLesson.value=r.counts?.lesson||0;instSkillup.value=r.counts?.skillup||0;instSuccess.value=r.counts?.success||0;instLevel3.value=r.counts?.level3||0;instTicketDeduct.value=r.ticketDeduct||0;instPayMethod.value=r.payMethod||'cash';const b=document.querySelector('#instructorEntry button[onclick="addInstructorSettlement()"]');if(b)b.textContent='수정 저장';instructorEntry.scrollIntoView({behavior:'smooth',block:'start'})}

function drawInstructorSettlements(){const el=document.getElementById('instructorSettlementList'),close=document.getElementById('instructorClosing'),x=instructorData().find(v=>v.id===activeInstructorId);if(!el||!x)return;const rows=instructorSettlements().filter(v=>v.instructorId===x.id).sort((a,b)=>a.date.localeCompare(b.date));const byDate={};rows.forEach(r=>{if(!byDate[r.date])byDate[r.date]={date:r.date,voucher:0,experience:0,lesson:0,skillup:0,success:0,level3:0,amount:0,ticketDeduct:0,cashAmount:0,mileageAmount:0,ids:[]};['voucher','experience','lesson','skillup','success','level3'].forEach(k=>byDate[r.date][k]+=(r.counts&&r.counts[k])||0);byDate[r.date].amount+=r.amount||0;byDate[r.date].ticketDeduct+=r.ticketDeduct||0;if((r.payMethod||'cash')==='mileage')byDate[r.date].mileageAmount+=r.amount||0;else byDate[r.date].cashAmount+=r.amount||0;byDate[r.date].ids.push(r.id)});const d=Object.values(byDate);el.innerHTML=d.length?'<h3>'+x.name+' 정산내역</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th>일자</th><th>바우처</th><th>체험</th><th>강습</th><th>스킬업</th><th>성공보수</th><th>3레벨교육</th><th>입장권 차감</th><th>현금정산</th><th>마일리지</th><th>일별 합계</th><th></th></tr></thead><tbody>'+d.map(r=>'<tr>'+[r.date,r.voucher||'',r.experience||'',r.lesson||'',r.skillup||'',r.success||'',r.level3||'',r.ticketDeduct?r.ticketDeduct.toLocaleString()+'원':'',r.cashAmount?r.cashAmount.toLocaleString()+'원':'',r.mileageAmount?r.mileageAmount.toLocaleString()+'P':'',r.amount.toLocaleString()+'원'].map(v=>'<td style="padding:9px;border-bottom:1px solid #e5eaee;white-space:nowrap;text-align:center">'+v+'</td>').join('')+'<td style="padding:6px;border-bottom:1px solid #e5eaee;white-space:nowrap">'+(r.ids.length===1?'<button class="btn" onclick="editSettlement('+r.ids[0]+')">수정</button><button class="btn" onclick="deleteSettlement('+r.ids[0]+')">삭제</button>':'<span class="note">등록 '+r.ids.length+'건</span>')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="note">등록된 정산내역이 없습니다.</p>';drawClosingPanel(x,rows)}
function drawClosingPanel(x,rows){const close=document.getElementById('instructorClosing');if(!close)return;const months=[...new Set(rows.map(r=>monthKey(r.date)))].sort().reverse(),saved=instructorClosings().filter(v=>v.instructorId===x.id).sort((a,b)=>b.month.localeCompare(a.month));if(!months.length&&!saved.length){close.innerHTML='';return}const current=months[0]||'',monthRows=rows.filter(r=>monthKey(r.date)===current),total=monthRows.filter(r=>(r.payMethod||'cash')!=='mileage').reduce((s,r)=>s+(r.amount||0),0),mileageTotal=monthRows.filter(r=>r.payMethod==='mileage').reduce((s,r)=>s+(r.amount||0),0),ticketTotal=monthRows.reduce((s,r)=>s+(r.ticketDeduct||0),0),done=saved.find(v=>v.month===current);let h='<div style="border-top:2px solid #17212b;padding-top:16px"><h3>월별 결산</h3>';if(current&&!done)h+='<p><strong>'+current+' 현금정산 '+total.toLocaleString()+'원 · 마일리지 '+mileageTotal.toLocaleString()+'P · 입장권 차감 '+ticketTotal.toLocaleString()+'원</strong></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px"><label>월세 차감<input id="closeRent" type="number" min="0" value="0"></label><label>관리비 차감<input id="closeManage" type="number" min="0" value="0"></label></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-finalize-type="withholding" data-month="'+current+'">원천징수 3.3%로 정산완료</button><button class="btn primary" data-finalize-type="vat" data-month="'+current+'">부가세 포함으로 정산완료</button></div>';else if(current&&done)h+='<p><strong>'+current+' 정산완료 · 실지급 '+Number(done.netPay).toLocaleString()+'원</strong></p>';if(saved.length)h+='<h4 style="margin-top:22px">정산 완료 내역</h4>'+saved.map(v=>'<div class="sched-item"><span>'+v.month+' · '+(v.taxType==='withholding'?'원천징수 3.3%':'부가세 포함')+' · 월세 '+Number(v.rent||0).toLocaleString()+'원 · 관리비 '+Number(v.management||0).toLocaleString()+'원</span><strong>실지급 '+Number(v.netPay).toLocaleString()+'원</strong></div>').join('');close.innerHTML=h+'</div>'}

function finalizeInstructorMonth(month,type){const x=instructorData().find(v=>v.id===activeInstructorId);if(!x)return;let closings=instructorClosings();if(closings.some(v=>v.instructorId===x.id&&v.month===month)){alert('이미 정산 완료된 월입니다.');return}const rows=instructorSettlements().filter(v=>v.instructorId===x.id&&monthKey(v.date)===month),gross=rows.filter(r=>(r.payMethod||'cash')!=='mileage').reduce((s,r)=>s+(r.amount||0),0),mileageTotal=rows.filter(r=>r.payMethod==='mileage').reduce((s,r)=>s+(r.amount||0),0),ticketTotal=rows.reduce((s,r)=>s+(r.ticketDeduct||0),0),rent=Math.max(0,Number(document.getElementById('closeRent')?.value)||0),management=Math.max(0,Number(document.getElementById('closeManage')?.value)||0);let tax=0,supply=0,vat=0,afterTax=gross;if(type==='withholding'){tax=Math.round(gross*0.033);afterTax=gross-tax}else{supply=Math.round(gross/1.1);vat=gross-supply}const netPay=Math.max(0,afterTax-rent-management);if(!confirm(month+' 정산을 완료할까요?\n실지급 '+netPay.toLocaleString()+'원'))return;closings.push({id:Date.now(),instructorId:x.id,memberNo:x.memberNo,name:x.name,month:month,taxType:type,gross:gross,mileageTotal:mileageTotal,ticketTotal:ticketTotal,tax:tax,supply:supply,vat:vat,rent:rent,management:management,netPay:netPay,closedAt:new Date().toISOString()});saveInstructorClosings(closings);if(mileageTotal>0&&x.memberNo){const m=testMembers.find(v=>v.no===x.memberNo),s=memberState(),bal=s[x.memberNo]||{cash:m?.cash||0,point:m?.point||0};bal.point+=mileageTotal;s[x.memberNo]=bal;localStorage.setItem('submarine_member_state_v1',JSON.stringify(s));addLedger({memberNo:x.memberNo,kind:'적립',cash:0,point:mileageTotal,note:month+' 강사정산 마일리지'});drawTestMembers()}drawInstructorSettlements()}
