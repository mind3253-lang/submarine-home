name: iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: rm -rf ios && npx cap add ios
      - run: npx cap sync ios
      - name: Prepare branded iOS app assets
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("../SM-logo-social.png")
          icon_dir=Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          targets=list(icon_dir.glob("*.png"))
          if not targets:
              raise SystemExit("AppIcon PNG target not found")
          img=Image.open(src).convert("RGBA").resize((1024,1024),Image.Resampling.LANCZOS)
          bg=Image.new("RGB",(1024,1024),"white")
          bg.paste(img,mask=img.getchannel("A"))
          for target in targets:
              bg.save(target,format="PNG",optimize=True)
          print("App icon:", ", ".join(str(x) for x in targets))
          PY
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SUBMARINE" "$PLIST" 2>/dev/null || true
      - name: Build unsigned simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0
      - name: Validate App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Create unsigned App Store archive
        id: archive
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/SUBMARINE.xcarchive CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 archive 2>&1 | tee "$GITHUB_WORKSPACE/ios-archive.log"
      - name: Export signed App Store IPA
        id: export
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -o pipefail
          rm -rf build/export
          xcodebuild -exportArchive -archivePath build/SUBMARINE.xcarchive -exportPath build/export -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$GITHUB_WORKSPACE/ios-export.log"
      - name: Upload build to App Store Connect
        id: upload
        if: steps.export.outcome == 'success'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA="$(find build/export -maxdepth 2 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$GITHUB_WORKSPACE/ios-upload.log"
      - name: Preserve App Store IPA
        if: steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SUBMARINE-iOS-AppStore-${{ github.run_number }}
          path: ios-app/build/export/*.ipa
      - name: Record build status
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "archive_outcome=${{ steps.archive.outcome }}"
            echo "export_outcome=${{ steps.export.outcome }}"
            echo "upload_outcome=${{ steps.upload.outcome }}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for f in ios-archive.log ios-export.log ios-upload.log; do
              echo
              echo "---- $f ----"
              if [ -f "$f" ]; then
                grep -E "error:|Error|Signing|Provisioning|certificate|profile|team|Authentication|failed|requires|upload|Uploaded|success" "$f" | tail -n 120 || tail -n 120 "$f"
              else
                echo "not created"
              fi
            done
          } > ios-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios-build-status.txt
          git commit -m "Record iOS build status [skip ci]" || true
          git push
      - name: Stop on distribution failure
        if: always() && (steps.archive.outcome != 'success' || steps.export.outcome != 'success' || steps.upload.outcome != 'success')
        run: exit 1
      - name: Package simulator build
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release-iphonesimulator/App.app SUBMARINE-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SUBMARINE-iOS-simulator
          path: ios-app/SUBMARINE-simulator.zip
