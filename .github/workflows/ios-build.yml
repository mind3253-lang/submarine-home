name: iOS Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: rm -rf ios && npx cap add ios
      - run: npx cap sync ios
      - name: Build unsigned simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Validate App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Create App Store archive
        id: archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/SUBMARINE.xcarchive -allowProvisioningUpdates -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" DEVELOPMENT_TEAM=M8AVCFQ98M CODE_SIGN_STYLE=Automatic archive 2>&1 | tee "$GITHUB_WORKSPACE/ios-archive.log"
      - name: Record build status
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "archive_outcome=${{ steps.archive.outcome }}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "---- relevant archive log ----"
            if [ -f ios-archive.log ]; then
              grep -E "error:|Signing|Provisioning|certificate|profile|team|Authentication|failed|requires" ios-archive.log | tail -n 80 || tail -n 80 ios-archive.log
            else
              echo "ios-archive.log not created"
            fi
          } > ios-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios-build-status.txt
          git commit -m "Record iOS build status [skip ci]" || true
          git push
      - name: Stop on archive failure
        if: steps.archive.outcome == 'failure'
        run: exit 1
      - name: Package simulator build
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release-iphonesimulator/App.app SUBMARINE-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SUBMARINE-iOS-simulator
          path: ios-app/SUBMARINE-simulator.zip
