name: Booking and waiver checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check worker syntax
        run: node --check worker.js
      - name: Execute booking coordinator integration tests
        run: node tests/booking-coordinator.mjs
      - name: Check Cloudflare config
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));if(!c.durable_objects?.bindings?.some(x=>x.name==='BOOKING_COORDINATOR'))process.exit(1);if(!c.triggers?.crons?.length)process.exit(1)"
      - name: Validate reservation invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('worker.js','utf8');
          for(const marker of ['export class BookingCoordinator','idempotencyKey','bookingSource:"admin"','ticketRefunded=true','async scheduled('])if(!s.includes(marker))throw Error('Missing '+marker);
          console.log('Booking and waiver invariant markers present');
          NODE
