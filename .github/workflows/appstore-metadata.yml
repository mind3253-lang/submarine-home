name: App Store Metadata Sync
on:
  workflow_dispatch:
  push:
    paths:
      - 'appstore/**'
      - '.github/workflows/appstore-metadata.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyjwt cryptography
      - name: Sync App Store Connect metadata
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: python appstore/sync.py
      - name: Record App Store sync status
        if: always()
        run: |
          test -f appstore-sync-status.txt || echo "sync=failure" > appstore-sync-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appstore-sync-status.txt
          git commit -m "Record App Store metadata sync [skip ci]" || true
          git push
