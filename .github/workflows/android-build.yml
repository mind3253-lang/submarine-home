name: Android Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Brand and version Android app
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">SUBMARINE</string>#' "$STRINGS"
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">SUBMARINE</string>#' "$STRINGS"

          BUILD_GRADLE="android/app/build.gradle"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$BUILD_GRADLE"
          sed -i -E 's/versionName "[^"]+"/versionName "1.0"/' "$BUILD_GRADLE"

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON="../SM-logo-social.png"
          test -s "$ICON"
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${spec%%:*}"; px="${spec##*:}"
            mkdir -p "android/app/src/main/res/$dir"
            convert "$ICON" -resize "${px}x${px}" "android/app/src/main/res/$dir/ic_launcher.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done
      - name: Configure release signing when secrets are present
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat >> android/app/build.gradle <<'EOF'

          if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
              android {
                  signingConfigs {
                      release {
                          storeFile file("upload-keystore.jks")
                          storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("ANDROID_KEY_ALIAS")
                          keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                      }
                  }
                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          EOF
            echo "ANDROID_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Build release AAB and debug APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"
      - name: Preserve Android artifacts
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SUBMARINE-Android-build-${{ github.run_number }}
          path: |
            ios-app/android/app/build/outputs/bundle/release/*.aab
            ios-app/android/app/build/outputs/apk/debug/*.apk
      - name: Record Android build status
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "run_number=${{ github.run_number }}"
            echo "gradle_outcome=${{ steps.gradle.outcome }}"
            echo "release_signed=${ANDROID_RELEASE_SIGNED:-false}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "---- artifacts ----"
            find ios-app/android/app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -print 2>/dev/null || true
            echo
            echo "---- build log tail ----"
            tail -n 160 android-build.log 2>/dev/null || true
          } > android-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build-status.txt
          git commit -m "Record Android build status [skip ci]" || true
          git push || true
      - name: Stop on build failure
        if: always() && steps.gradle.outcome != 'success'
        run: exit 1
