name: Android TWA Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: "1.0"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-app/upload-keystore.jks

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare SUBMARINE icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          cp submarine-app-512.png android-app/app/src/main/res/drawable-nodpi/ic_launcher.png
          test -s android-app/app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Configure optional release signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo "ANDROID_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            unset ANDROID_KEYSTORE_PATH
            echo "ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release AAB and debug APK
        id: gradle
        continue-on-error: true
        working-directory: android-app
        run: |
          set -o pipefail
          gradle --no-daemon :app:bundleRelease :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Verify signed release bundle
        if: steps.gradle.outcome == 'success' && env.ANDROID_RELEASE_SIGNED == 'true'
        working-directory: android-app
        run: |
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB"
          jarsigner -verify "$AAB"

      - name: Upload Android artifacts
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SUBMARINE-Android-TWA-${{ github.run_number }}
          path: |
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/apk/debug/*.apk

      - name: Record Android build status
        if: always()
        run: |
          {
            echo "architecture=TWA"
            echo "package=asia.submarine.app"
            echo "commit=$GITHUB_SHA"
            echo "run_number=${{ github.run_number }}"
            echo "gradle_outcome=${{ steps.gradle.outcome }}"
            echo "release_signed=${ANDROID_RELEASE_SIGNED:-false}"
            echo "target_sdk=36"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "---- artifacts ----"
            find android-app/app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -print 2>/dev/null || true
            echo
            echo "---- build log tail ----"
            tail -n 180 android-build.log 2>/dev/null || true
          } > android-build-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build-status.txt
          git commit -m "Record Android TWA build status [skip ci]" || true
          git pull --rebase || true
          git push || true

      - name: Stop on build failure
        if: always() && steps.gradle.outcome != 'success'
        run: exit 1
